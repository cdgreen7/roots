# Mosquitto broker settings for Roots.

# Save retained messages (board status, actuator state, rules) to disk so they survive a broker restart.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Every client (boards and the API) must log in with a user from the password file.
# Add or change a user (then restart the broker): docker run --rm -it -v "$PWD/mosquitto:/m" eclipse-mosquitto:2 mosquitto_passwd /m/passwd <user>
allow_anonymous false
password_file /mosquitto/config/passwd

# Plain MQTT for the boards. (TODO: move to 8883 + TLS before opening to the internet.)
listener 1883

# MQTT over WebSockets, for clients that can't open a raw TCP connection (such as a browser).
listener 9001
protocol websockets