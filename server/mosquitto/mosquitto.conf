# Mosquitto broker settings for Roots.

# Save retained messages (board status, actuator state, rules) to disk so they survive a broker restart.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Every client (boards and the API) must log in with a user from the password file.
# Add or change a user (then restart the broker): docker run --rm -it -v "$PWD/mosquitto:/m" eclipse-mosquitto:2 mosquitto_passwd /m/passwd <user>
allow_anonymous false
password_file /mosquitto/config/passwd

# Caddy's certificate files are only readable by root, and Mosquitto normally drops to its own user
# before loading certificates, so it stays root inside the container.
user root

# Plain MQTT, only reachable inside Docker (the API connects here). Not published in docker-compose.yml.
listener 1883

# MQTT over TLS for the boards. Uses the Let's Encrypt certificate Caddy keeps in its data volume.
# Caddy renews it automatically; restart this container afterward to load the new one (see server/README.md).
listener 8883
certfile /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/roots-plants.duckdns.org/roots-plants.duckdns.org.crt
keyfile  /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/roots-plants.duckdns.org/roots-plants.duckdns.org.key

# MQTT over WebSockets, for clients that can't open a raw TCP connection (such as a browser).
listener 9001
protocol websockets