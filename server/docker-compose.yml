# Runs the whole Roots backend: the database, the MQTT broker, and the API.
# Settings come from .env (copy .env.example to start).
services:
  # PostgreSQL database. The .sql files in ./db create the tables the first time it starts with an empty volume.
  db:
    image: postgres:18
    container_name: roots-db
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"   # local only (for pgAdmin/psql on the host)
    volumes:
      - roots_pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Mosquitto MQTT broker. The boards publish readings to it and receive commands from it.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: roots-mqtt
    ports:
      - "8883:8883"   # boards, MQTT over TLS (1883 stays internal for the API)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - caddy_data:/caddy:ro    # TLS certificate that Caddy gets from Let's Encrypt
      - roots_mqtt_data:/mosquitto/data
      - roots_mqtt_log:/mosquitto/log
    restart: unless-stopped

  # Roots API (FastAPI). Waits for the database to be healthy before starting.
  api:
    build: ./api
    container_name: roots-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    # No published port: the app reaches the API through Caddy (HTTPS).
    volumes:
      - roots_uploads:/srv/uploads   # post images
    restart: unless-stopped

  # Caddy reverse proxy. Gets and renews the HTTPS certificate automatically and forwards requests to the API.
  caddy:
    image: caddy:2
    container_name: roots-caddy
    depends_on:
      - api
    ports:
      - "80:80"     # Let's Encrypt verification + redirect to HTTPS
      - "443:443"   # the app talks to the API here
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

# Named volumes keep the data when containers are rebuilt.
volumes:
  roots_pgdata:
  roots_mqtt_data:
  roots_mqtt_log:
  roots_uploads:
  caddy_data:
  caddy_config: